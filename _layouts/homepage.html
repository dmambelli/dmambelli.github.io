<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <title>{{ site.title }}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | default: 'Researcher interested in computer vision, multi-agent systems, and evaluation of RL algorithms with applications to robotics.' }}">
    <link rel="icon" href="{{ site.favicon | relative_url }}" type="image/png">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <h1>{{ site.title }}</h1>
        <div class="bio">{{ content }}</div>
      </header>
      <section class="field" aria-label="Interactive firefly matrix">
        <canvas id="firefly-matrix" role="img" aria-label="Interactive matrix of fireflies. Click a cell to disturb its state."></canvas>
        <button class="reset-button" type="button" data-reset aria-label="Reset simulation" title="Reset simulation">
          <span aria-hidden="true">reset</span>
        </button>
      </section>
    </main>
    <script src="{{ '/assets/js/swarm.js' | relative_url }}"></script>
  </body>
</html>
