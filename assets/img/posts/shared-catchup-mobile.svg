<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 760" role="img" aria-labelledby="title desc">
  <title id="title">Private reconstruction compared with a shared technical commons</title>
  <desc id="desc">The private case repeats three catch-up steps for four followers. The shared case completes catch-up once and branches into separate experiments.</desc>
  <defs>
    <marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="6" refY="3.5">
      <path d="M0 0L7 3.5L0 7Z" fill="#000"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #000; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.1px; }
      .label { font-size: 12px; font-weight: 700; }
      .small { font-size: 11px; font-weight: 700; }
      .white { fill: #fff; }
      .line { fill: none; stroke: #000; stroke-width: 2; }
      .soft { fill: none; stroke: #8a8a8a; stroke-width: 1.5; }
      .dash { stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="430" height="760" fill="#fff"/>

  <text class="eyebrow" x="24" y="32">PRIVATE FOLLOWING</text>
  <rect x="24" y="50" width="382" height="42" fill="#000"/>
  <text class="white" x="215" y="76" font-size="12" font-weight="700" text-anchor="middle">MOVING CLOSED FRONTIER</text>

  <g aria-label="Four followers repeat the same three steps">
    <g transform="translate(0 0)">
      <circle cx="48" cy="133" r="14" fill="#fff" stroke="#000" stroke-width="2"/>
      <text class="small" x="48" y="137" text-anchor="middle">F1</text>
      <line class="soft" x1="63" x2="92" y1="133" y2="133"/>
      <rect x="92" y="118" width="44" height="30" fill="#e6e6e6" stroke="#000"/>
      <rect x="148" y="118" width="44" height="30" fill="#e6e6e6" stroke="#000"/>
      <rect x="204" y="118" width="44" height="30" fill="#e6e6e6" stroke="#000"/>
      <text class="small" x="114" y="137" text-anchor="middle">1</text>
      <text class="small" x="170" y="137" text-anchor="middle">2</text>
      <text class="small" x="226" y="137" text-anchor="middle">3</text>
      <line class="line dash" x1="248" x2="374" y1="133" y2="133" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(0 58)">
      <circle cx="48" cy="133" r="14" fill="#fff" stroke="#000" stroke-width="2"/>
      <text class="small" x="48" y="137" text-anchor="middle">F2</text>
      <line class="soft" x1="63" x2="92" y1="133" y2="133"/>
      <rect x="92" y="118" width="44" height="30" fill="#e6e6e6" stroke="#000"/>
      <rect x="148" y="118" width="44" height="30" fill="#e6e6e6" stroke="#000"/>
      <rect x="204" y="118" width="44" height="30" fill="#e6e6e6" stroke="#000"/>
      <text class="small" x="114" y="137" text-anchor="middle">1</text>
      <text class="small" x="170" y="137" text-anchor="middle">2</text>
      <text class="small" x="226" y="137" text-anchor="middle">3</text>
      <line class="line dash" x1="248" x2="374" y1="133" y2="133" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(0 116)">
      <circle cx="48" cy="133" r="14" fill="#fff" stroke="#000" stroke-width="2"/>
      <text class="small" x="48" y="137" text-anchor="middle">F3</text>
      <line class="soft" x1="63" x2="92" y1="133" y2="133"/>
      <rect x="92" y="118" width="44" height="30" fill="#e6e6e6" stroke="#000"/>
      <rect x="148" y="118" width="44" height="30" fill="#e6e6e6" stroke="#000"/>
      <rect x="204" y="118" width="44" height="30" fill="#e6e6e6" stroke="#000"/>
      <text class="small" x="114" y="137" text-anchor="middle">1</text>
      <text class="small" x="170" y="137" text-anchor="middle">2</text>
      <text class="small" x="226" y="137" text-anchor="middle">3</text>
      <line class="line dash" x1="248" x2="374" y1="133" y2="133" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(0 174)">
      <circle cx="48" cy="133" r="14" fill="#fff" stroke="#000" stroke-width="2"/>
      <text class="small" x="48" y="137" text-anchor="middle">F4</text>
      <line class="soft" x1="63" x2="92" y1="133" y2="133"/>
      <rect x="92" y="118" width="44" height="30" fill="#e6e6e6" stroke="#000"/>
      <rect x="148" y="118" width="44" height="30" fill="#e6e6e6" stroke="#000"/>
      <rect x="204" y="118" width="44" height="30" fill="#e6e6e6" stroke="#000"/>
      <text class="small" x="114" y="137" text-anchor="middle">1</text>
      <text class="small" x="170" y="137" text-anchor="middle">2</text>
      <text class="small" x="226" y="137" text-anchor="middle">3</text>
      <line class="line dash" x1="248" x2="374" y1="133" y2="133" marker-end="url(#arrow)"/>
    </g>
  </g>
  <text class="label" x="215" y="347" text-anchor="middle">the same catch-up work, four times</text>

  <line x1="24" x2="406" y1="377" y2="377" stroke="#d7d7d7" stroke-width="1.5"/>

  <text class="eyebrow" x="24" y="412">SHARED TECHNICAL COMMONS</text>
  <rect x="24" y="430" width="382" height="42" fill="#000"/>
  <text class="white" x="215" y="456" font-size="12" font-weight="700" text-anchor="middle">MOVING CLOSED FRONTIER</text>

  <circle cx="48" cy="513" r="14" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="48" cy="567" r="14" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="48" cy="621" r="14" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="48" cy="675" r="14" fill="#fff" stroke="#000" stroke-width="2"/>
  <text class="small" x="48" y="517" text-anchor="middle">F1</text>
  <text class="small" x="48" y="571" text-anchor="middle">F2</text>
  <text class="small" x="48" y="625" text-anchor="middle">F3</text>
  <text class="small" x="48" y="679" text-anchor="middle">F4</text>

  <line class="soft" x1="63" x2="120" y1="513" y2="574"/>
  <line class="soft" x1="63" x2="120" y1="567" y2="585"/>
  <line class="soft" x1="63" x2="120" y1="621" y2="596"/>
  <line class="soft" x1="63" x2="120" y1="675" y2="607"/>
  <rect x="120" y="557" width="126" height="66" fill="#e6e6e6" stroke="#000" stroke-width="2"/>
  <text class="small" x="183" y="585" text-anchor="middle">CATCH UP</text>
  <text class="small" x="183" y="603" text-anchor="middle">ONCE</text>

  <line class="line" x1="246" x2="325" y1="574" y2="513" marker-end="url(#arrow)"/>
  <line class="line" x1="246" x2="325" y1="584" y2="567" marker-end="url(#arrow)"/>
  <line class="line" x1="246" x2="325" y1="596" y2="621" marker-end="url(#arrow)"/>
  <line class="line" x1="246" x2="325" y1="606" y2="675" marker-end="url(#arrow)"/>
  <rect x="329" y="499" width="58" height="28" fill="#000"/>
  <rect x="329" y="553" width="58" height="28" fill="#000"/>
  <rect x="329" y="607" width="58" height="28" fill="#000"/>
  <rect x="329" y="661" width="58" height="28" fill="#000"/>
  <text class="small white" x="358" y="517" text-anchor="middle">EXP 1</text>
  <text class="small white" x="358" y="571" text-anchor="middle">EXP 2</text>
  <text class="small white" x="358" y="625" text-anchor="middle">EXP 3</text>
  <text class="small white" x="358" y="679" text-anchor="middle">EXP 4</text>
  <text class="label" x="215" y="725" text-anchor="middle">catch-up once, then explore in parallel</text>
</svg>
